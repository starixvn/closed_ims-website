<!doctype html>
<html  lang='en'  >
<head>
    <title></title>
     <script src="../Scripts/_Libs/FormatLibs/NumberFormat/numeral.js" type="text/javascript"></script>
    <script src="../Scripts/_Libs/Utils/jquery.numeric.js" type="text/javascript"></script>
     <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js"></script>
   
</head>
<body ng-app='Invoice' ng-controller="InvoiceController" >
<table style="width: 100%; border: 1px solid black;" >
                <tbody ng-repeat="(what,statement) in invoiceItems">
                            <tr ng-repeat="statementDetail in statement">
                                 <td ng-show="$first" rowspan="{{statement.length}}" style="width: 30%; vertical-align:top;padding-top: 20px; ">
                                                <div style="font-size: 20px; display: inline-block;">
                                                   {{$parent.$index}}</div>
                                                <button ng-click="deleteItem($parent.$index)">
                                        Delete
                                        </button>
                                            </td>
                                     <td  class="" style="width: 35%; text-align: center; height: 60px; ">
                                            <textarea  rows="2" cols="75" name="styled-textarea" id="orgItem_des_{{$index}}"  onfocus="invoiceApp.helper.onFocusInput(this)" onblur="invoiceApp.helper.onBlurInput(this)" onchange=" invoiceApp.AllowUpdateNewInfo();">
                                                 {{statementDetail.Description}}
                                    </textarea> </td>
                                        <td class="" style="width: 20%; text-align: center;">
                                            <textarea  rows="2" cols="33" name="styled-textarea" id="orgItem_ref_$index"  onfocus="invoiceApp.helper.onFocusInput(this)" onblur="invoiceApp.helper.onBlurInput(this)"  onchange=" invoiceApp.AllowUpdateNewInfo();">
                                            {{statementDetail.Reference}}</textarea>
                                        </td>
                                        <td class="" style="width: 15%; text-align: right; vertical-align: middle; font-weight: bold;
                                            padding-right: 10px;">
                                            
                                            <input  ng-show="statementDetail.isNew" type="number"  ng-model="statementDetail.Amount">
                                            <span ng-show="!statementDetail.isNew">{{statementDetail.Amount | number:2}} </span>
                                        </td>
                            </tr>

                            </tbody>
                            <tbody>
                             <tr class="total" style="width: 100%;">
                                    <td style="text-align: center; border-right: 0px solid black !important;">
                                        <button ng-click="insertItem()">
                                        Insert
                                        </button>
                                    </td>
                                    <td style="width: 35%; height: 30px;">
                                    </td>
                                    <td style="width: 20%; text-align: right; font-weight: bold; ">
                                        TOTAL AMOUNT
                                    </td>
                                    <td style="width: 15%; text-align: center; font-weight: bold;">
                                        <div style="width: 90%; height: 20px; margin: 0px 5px 0px 10px; text-align: right;">
                                            <label id="totalAmount" style="font-weight: bold;">
                                            {{total | number:2}}
                                            </label>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
<script type="text/javascript">
    var FormatConstant = {
        INT_NUMBER: '0,0',
        TWO_DECIMAL_NUMBER: '0,0.00',
        FOUR_DECIMAL_NUMBER: '0,0.0000',
        TWO_DECIMAL_PERCENT_NUMBER: '0,0.00%',
        MMM_DD_YYYY_STRING: 'MMM DD, YYYY',
        M_DD_YY_STRING: 'M dd, yy',
        MM_DD_YYYY_WITH_SLASH_STRING: 'MM/dd/yyyy',
        MMM_YY_STRING: 'MMM YY',
        MMM_YY_STRING_MONTH_PICKER: 'MMM yyyy',
        MMM_DD_YY_STRING_MONTH_PICKER: 'MMM dd, yyyy',
        MM_DD_YYYY_WITH_SLASH_STRING_MOMENT: 'M/D/YYYY',
        MMM_DD_YYYY_STRING_MOMENT: 'MMM D, YYYY'
    }

    function InvoiceController($scope) {
        //        $scope.invoiceItems = Items.query();
        $scope.total = 0;
        $scope.invoiceItems = [[{ Amount: 2500.56, Description: "dfaf", Reference: "dfasfdaad", isNew: false },
                                                        { Amount: 2600.45, Description: "dfaf", Reference: "dfasfdaad", isNew: false}],
                                                        [{ Amount: 3600.96, Description: "dfaf", Reference: "dfasfdaad", isNew: false },
                                                        { Amount: 4500.56, Description: "dfaf", Reference: "dfasfdaad", isNew: false}],
                                                        [{ Amount: 5500, Description: "dfaf", Reference: "dfasfdaad", isNew: false },
                                                        { Amount: 6500, Description: "dfaf", Reference: "dfasfdaad", isNew: false}]
            ];


        $scope.insertItem = function () {
//                        $scope.invoiceItems.splice(1, 0, [[{ Amount: 500, Description: "new", Reference: "new"}]]);
            $scope.invoiceItems.push([{ Amount:9500, Description: "new", Reference: "new", isNew: true}]);
        };

        $scope.deleteItem = function ($index) {
            $scope.invoiceItems.splice($index , 1);
//            $scope.invoiceItems.pop($index);
        };

        $scope.$watch(function () {
            var total = 0;
            for (var i = 0; i < $scope.invoiceItems.length; i++) {
                for (var j = 0; j < $scope.invoiceItems[i].length; j++) {
                    total = total + $scope.invoiceItems[i][j].Amount ;
                }
            }
            $scope.total = total;
        });
    }

    var shoppingModule = angular.module('Invoice', []);


    shoppingModule.factory('Items', function () {
        var items = {};
        items.query = function () {
            // In real apps, we'd pull this data from the server...
            return [[{ Amount: 500, Description: "dfaf", Reference: "dfasfdaad" },
                                                        { Amount: 500, Description: "dfaf", Reference: "dfasfdaad"}],
                                                        [{ Amount: 500, Description: "dfaf", Reference: "dfasfdaad" },
                                                        { Amount: 500, Description: "dfaf", Reference: "dfasfdaad"}],
                                                        [{ Amount: 500, Description: "dfaf", Reference: "dfasfdaad" },
                                                        { Amount: 500, Description: "dfaf", Reference: "dfasfdaad"}]
            ];
        };
        return items;
    });
</script>
</body>
</html>
