<!doctype html>
<html lang='en'>
<head>
    <title></title>
    <script src="../Scripts/_Libs/FormatLibs/NumberFormat/numeral.js" type="text/javascript"></script>
    <script src="../Scripts/_Libs/Utils/jquery.numeric.js" type="text/javascript"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js"></script>
</head>
<body ng-app='Invoice' ng-controller="InvoiceController">
    <table style="width: 100%; border: 1px solid black;">
        <tbody ng-repeat="(what,statement) in invoiceItems">
            <tr ng-repeat="statementDetail in statement">
                <td ng-show="$first" rowspan="{{statement.length}}" style="width: 30%; vertical-align: top;
                    padding-top: 20px;">
                    <div style="font-size: 20px; display: inline-block;">
                        {{$parent.$index}}</div>
                    <button ng-click="deleteItem($parent.$index)">
                        Delete
                    </button>
                </td>
                <td class="" style="width: 35%; text-align: center; height: 60px;">
                    <textarea rows="2" cols="75" ng-model="statementDetail.Description"> </textarea>
                </td>
                <td class="" style="width: 20%; text-align: center;">
                    <textarea rows="2" cols="33" ng-model="statementDetail.Reference"> </textarea>
                </td>
                <td class="" style="width: 15%; text-align: right; vertical-align: middle; font-weight: bold;
                    padding-right: 10px;">
                    <input  onkeydown='validateNumber(event)' style="font-weight: bold;text-align:right;width:95%;" ng-show="statementDetail.isNew" type="text" ng-model="statementDetail.AmountFormated" >
                    <span ng-show="!statementDetail.isNew">{{statementDetail.Amount | number:2}} </span>
                </td>
            </tr>
        </tbody>
        <tbody>
            <tr class="total" style="width: 100%;">
                <td style="text-align: center; border-right: 0px solid black !important;">
                    <button ng-click="insertItem()">
                        Insert
                    </button>
                </td>
                <td style="width: 35%; height: 30px;">
                </td>
                <td style="width: 20%; text-align: right; font-weight: bold;">
                    TOTAL AMOUNT
                </td>
                <td style="width: 15%; text-align: center; font-weight: bold;">
                    <div style="width: 90%; height: 20px; margin: 0px 5px 0px 10px; text-align: right;">
                        <label id="totalAmount" style="font-weight: bold;">
                            {{total}}
                        </label>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <script type="text/javascript">
        var FormatConstant = {
            INT_NUMBER: '0,0',
            TWO_DECIMAL_NUMBER: '0,0.00',
            FOUR_DECIMAL_NUMBER: '0,0.0000',
            TWO_DECIMAL_PERCENT_NUMBER: '0,0.00%',
            MMM_DD_YYYY_STRING: 'MMM DD, YYYY',
            M_DD_YY_STRING: 'M dd, yy',
            MM_DD_YYYY_WITH_SLASH_STRING: 'MM/dd/yyyy',
            MMM_YY_STRING: 'MMM YY',
            MMM_YY_STRING_MONTH_PICKER: 'MMM yyyy',
            MMM_DD_YY_STRING_MONTH_PICKER: 'MMM dd, yyyy',
            MM_DD_YYYY_WITH_SLASH_STRING_MOMENT: 'M/D/YYYY',
            MMM_DD_YYYY_STRING_MOMENT: 'MMM D, YYYY'
        }

        function validateNumber(event) {
            // Prevent shift key since its not needed
            if (event.shiftKey == true) {
                event.preventDefault();
            }
            // Allow Only: keyboard 0-9, numpad 0-9, backspace, tab, left arrow, right arrow, delete
            if ((event.keyCode >= 48 && event.keyCode <= 57) || (event.keyCode >= 96 && event.keyCode <= 105) || event.keyCode == 8 || event.keyCode == 9 || event.keyCode == 37 || event.keyCode == 39 || event.keyCode == 46) {
                // Allow normal operation
            } else {
                // Prevent the rest
                event.preventDefault();
            }
        }

   

        function InvoiceController($scope) {
            //        $scope.invoiceItems = Items.query();
            $scope.total = 0;
//            $scope.invoiceItems = [[{ Amount: "2500.56", Description: "dfaf", Reference: "dfasfdaad", isNew: false },
//                                                        { Amount: 2600.45, Description: "dfaf", Reference: "dfasfdaad", isNew: false}],
//                                                        [{ Amount: 3600.96, Description: "dfaf", Reference: "dfasfdaad", isNew: false },
//                                                        { Amount: 4500.56, Description: "dfaf", Reference: "dfasfdaad", isNew: false}],
//                                                        [{ Amount: 5500, Description: "dfaf", Reference: "dfasfdaad", isNew: false },
//                                                        { Amount: 6500, Description: "dfaf", Reference: "dfasfdaad", isNew: false}]
//            ];
            $scope.invoiceItems = [[{ Amount: 2500.56, AmountFormated: '2,500.56', Description: "dfaf", Reference: "dfasfdaad", isNew: false },
                                                        { Amount: 2600.45, AmountFormated: '2,500.56', Description: "dfaf", Reference: "dfasfdaad", isNew: false}]];

            $scope.insertItem = function () {
                //                        $scope.invoiceItems.splice(1, 0, [[{ Amount: 500, Description: "new", Reference: "new"}]]);
                $scope.invoiceItems.push([{ Amount: 0.00, AmountFormated: '1,300.56', Description: "new", Reference: "new", isNew: true}]);
            };

            $scope.deleteItem = function ($index) {
                $scope.invoiceItems.splice($index, 1);
                //            $scope.invoiceItems.pop($index);
            };

            $scope.change = function ($index) {
                var temp = 0;
                if ($scope.invoiceItems[$index][0].AmountFormated.toString().indexOf(')') !== -1) {
                    temp = parseFloat($scope.invoiceItems[$index][0].AmountFormated.toString().replace(')', '').replace('(', '').replace(/\,/g, '').replace(',', '')) * -1;
                }
                else {
                    temp = parseFloat($scope.invoiceItems[$index][0].AmountFormated.toString().replace(/\,/g, '').replace(',', ''));
                }

                $scope.invoiceItems[$index][0].Amount = temp;

                $scope.invoiceItems[$index][0].AmountFormated = temp < 0 ? '(' + numeral(temp * -1).format(FormatConstant.TWO_DECIMAL_NUMBER) + ')' : numeral(temp).format(FormatConstant.TWO_DECIMAL_NUMBER); 

//                $scope.invoiceItems[$index][0].AmountFormated = numeral($scope.invoiceItems[$index][0].AmountFormated).format(FormatConstant.TWO_DECIMAL_NUMBER);
                //                $scope.invoiceItems[$index][0].Amount = $scope.invoiceItems[$index][0].Amount.toString().replace(/\,/g, '').replace(',', '');
                //                $scope.invoiceItems.splice($index, 1);
                //            $scope.invoiceItems.pop($index);
            };

            $scope.$watch(function () {
                var total = 0;
                for (var i = 0; i < $scope.invoiceItems.length; i++) {
                    for (var j = 0; j < $scope.invoiceItems[i].length; j++) {
                        //                        $scope.invoiceItems[i][j].Amount = parseFloat($scope.invoiceItems[i][j].Amount);


                        var temp = 0;
                        if ($scope.invoiceItems[i][j].AmountFormated.toString().indexOf(')') !== -1) {
                            temp = parseFloat($scope.invoiceItems[i][j].AmountFormated.toString().replace(')', '').replace('(', '').replace(/\,/g, '').replace(',', '')) * -1;
                        }
                        else {
                            temp = parseFloat($scope.invoiceItems[i][j].AmountFormated.toString().replace(/\,/g, '').replace(',', ''));
                        }

                        $scope.invoiceItems[i][j].Amount = temp;

                        $scope.invoiceItems[i][j].AmountFormated = temp < 0 ? '(' + numeral(temp * -1).format(FormatConstant.TWO_DECIMAL_NUMBER) + ')' : numeral(temp).format(FormatConstant.TWO_DECIMAL_NUMBER); 
                       
                       
                        total = total + $scope.invoiceItems[i][j].Amount * 1;

//                        if ($scope.invoiceItems[i][j].Amount.toString().indexOf(')') !== -1) {
//                            $scope.invoiceItems[i][j].Amount = parseFloat($scope.invoiceItems[i][j].Amount.toString().replace(')', '').replace('(', '')) * -1;
//                        }
//                        //                        total = total + $scope.invoiceItems[i][j].Amount * 1;

//                        if (!$scope.invoiceItems[i][j].isNew) {
//                            $scope.invoiceItems[i][j].Amount = parseFloat($scope.invoiceItems[i][j].Amount.toString().replace(/\,/g, '').replace(',', ''));
//                            total = total + $scope.invoiceItems[i][j].Amount * 1;
//                        }
//                        else {
//                            var temp = parseFloat($scope.invoiceItems[i][j].Amount.toString().replace(/\,/g, '').replace(',', ''));
//                            total = total + temp;
//                        }
                    }
                }
                $scope.total = total < 0 ? '(' + numeral(total * -1).format(FormatConstant.TWO_DECIMAL_NUMBER) + ')' : numeral(total).format(FormatConstant.TWO_DECIMAL_NUMBER); ;
            });
        }

        var shoppingModule = angular.module('Invoice', []);

        shoppingModule.directive('renderOnblur', function () {
            return {
                require: 'ngModel',
                restrict: 'A',
                link: function (scope, elm, attrs, ctrl) {
                    elm.bind('blur', function () {
                        var viewValue = ctrl.$modelValue.toString().replace(/\,/g, '').replace(',', '');
                        for (var i in ctrl.$formatters) {
                            viewValue = ctrl.$formatters[i](viewValue);
                        }

                        ctrl.$viewValue = viewValue < 0 ? '(' + numeral(viewValue * -1).format(FormatConstant.TWO_DECIMAL_NUMBER) + ')' : numeral(viewValue).format(FormatConstant.TWO_DECIMAL_NUMBER); 
                        ctrl.$render();
                    });
                }
            };
        });


        shoppingModule.factory('Items', function () {
            var items = {};
            items.query = function () {
                // In real apps, we'd pull this data from the server...
                return [[{ Amount: 500, Description: "dfaf", Reference: "dfasfdaad" },
                                                        { Amount: 500, Description: "dfaf", Reference: "dfasfdaad"}],
                                                        [{ Amount: 500, Description: "dfaf", Reference: "dfasfdaad" },
                                                        { Amount: 500, Description: "dfaf", Reference: "dfasfdaad"}],
                                                        [{ Amount: 500, Description: "dfaf", Reference: "dfasfdaad" },
                                                        { Amount: 500, Description: "dfaf", Reference: "dfasfdaad"}]
            ];
            };
            return items;
        });
    </script>
</body>
</html>
